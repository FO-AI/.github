name: PR template

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-template:
    runs-on: ubuntu-latest
    steps:
      - name: Check the PR body follows the org template
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_API_URL: ${{ github.event.pull_request.url }}
        shell: python3 {0}
        run: |
          import json, os, re, sys, urllib.request

          REQUIRED_SECTIONS = ("What & why", "How I tested", "Risk & rollout")
          # Lines the template pre-fills. They do not count as content.
          TEMPLATE_STUB = re.compile(
              r"^\s*(Closes #.*|Card:.*|- \[ \] No migration, env-var, or deploy impact)\s*$"
          )

          # Read the current body, not the event payload, so a re-run sees description edits.
          request = urllib.request.Request(
              os.environ["PR_API_URL"],
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
              },
          )
          with urllib.request.urlopen(request) as response:
              pr_body = json.load(response).get("body") or ""

          body = re.sub(r"<!--.*?-->", "", pr_body, flags=re.DOTALL)

          sections, current = {}, None
          for line in body.splitlines():
              heading = re.match(r"^##\s+(.+?)\s*$", line)
              if heading:
                  current = heading.group(1)
                  sections[current] = []
              elif current and not TEMPLATE_STUB.match(line):
                  sections[current].append(line)

          problems = []
          for name in REQUIRED_SECTIONS:
              if name not in sections:
                  problems.append(f"Missing section '## {name}'.")
              elif not "".join(sections[name]).strip():
                  problems.append(f"Section '## {name}' is empty.")

          for problem in problems:
              print(f"::error::{problem}")
          if problems:
              print("Fill in the PR description from https://github.com/FO-AI/.github/blob/main/pull_request_template.md")
              print("::error::After you fix the description, click Re-run on this check.")
              sys.exit(1)
          print("PR description follows the template.")
